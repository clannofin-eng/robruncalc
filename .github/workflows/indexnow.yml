# After every upload of the site, tells Bing, Yandex and the other IndexNow search engines which pages
# are new, changed or gone. The list of pages comes from the site build (.github/indexnow/pages.txt);
# the work is done by .github/indexnow/ping.py. "Run workflow" by hand sends every page again.
name: IndexNow

on:
  push:
    paths:
      - .github/indexnow/pages.txt
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: indexnow
  cancel-in-progress: false

jobs:
  ping:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - name: Send new and changed pages to IndexNow
        run: python3 .github/indexnow/ping.py "$BEFORE"
        env:
          BEFORE: ${{ github.event_name == 'push' && github.event.before || '' }}
